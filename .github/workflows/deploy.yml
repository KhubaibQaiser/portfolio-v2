name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never cancel an in-flight deploy — a half-applied CloudFormation update is worse
# than a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# OIDC: GitHub mints a short-lived token that assumes the AWS deploy role.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & deploy to AWS
    runs-on: ubuntu-latest
    # Optional manual approval gate: add required reviewers to this environment.
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & type check
        run: |
          pnpm lint
          pnpm typecheck

      - name: Build OpenNext bundles
        run: |
          pnpm --filter @portfolio/web exec open-next build
          pnpm --filter @portfolio/admin exec open-next build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: CDK deploy
        working-directory: packages/infra
        run: >
          pnpm exec cdk deploy
          Portfolio-Data Portfolio-Auth Portfolio-Web Portfolio-Admin Portfolio-Shared Portfolio-Oidc
          --require-approval never --concurrency 4
          -c adminUrls=${{ vars.ADMIN_URLS }}
          -c alertEmail=${{ vars.ALERT_EMAIL }}
          -c contactEmail=${{ vars.CONTACT_EMAIL }}
          -c githubRepo=${{ github.repository }}
