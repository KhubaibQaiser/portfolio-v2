name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# One run per ref. Cancel superseded PR runs, but never cancel a main run — a
# half-applied deploy is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  integration:
    name: Integration tests (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Start DynamoDB Local
        run: docker compose -f docker-compose.dev.yml up -d
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 15); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not become reachable" >&2
          exit 1
      - run: pnpm test:integration
      - name: Stop DynamoDB Local
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  # Personal-account repos do not need GITLEAKS_LICENSE. If this repo is
  # later moved to a GitHub Organization, add that secret or the job fails.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evals:
    name: Resume AI evals (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm eval:resume

  # Named separately from "Unit tests" so the candidate-mcp trust boundary
  # (see docs/adr/0003) has its own visible, always-green gate: auth
  # verification (valid/expired/wrong-scope/alg-confusion), output
  # sanitization, rate limiting, and the CandidateMcpStack CDK assertions
  # (real synth + esbuild bundling of the Lambda entry, so a broken import
  # graph fails here too). All fixture/offline — no network calls, no
  # deployed infra required.
  mcp-security:
    name: Candidate-MCP security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @portfolio/candidate-mcp typecheck
      - run: >
          pnpm exec vitest run
          apps/candidate-mcp
          packages/infra/src/stacks/candidate-mcp-stack.test.ts

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

  # Builds Next apps only (Storybook is built at deploy via build-storybook).
  # Uploads the web .next output so Lighthouse can reuse it without rebuilding.
  build:
    name: Build
    needs: [lint, typecheck, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Upload web build for Lighthouse
        uses: actions/upload-artifact@v7
        with:
          name: web-next-build
          path: apps/web/.next
          include-hidden-files: true
          retention-days: 1

  # Runs against the production build on PRs and main. Deploy waits on this job
  # so a Lighthouse regression blocks prod (see deploy.needs).
  # Matrix covers desktop + mobile; performance must be >= 0.90 on both.
  # Reuses the Build job artifact — no second Next compile.
  lighthouse:
    name: Lighthouse CI (${{ matrix.formFactor }})
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        formFactor: [desktop, mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-next-build
          path: apps/web/.next
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/web/lighthouserc.${{ matrix.formFactor }}.json
          uploadArtifacts: true

  deploy:
    name: Deploy to AWS
    needs: [lighthouse, e2e, evals, secrets, mcp-security]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Optional manual approval gate: add required reviewers to this environment.
    environment: production
    timeout-minutes: 45
    # OIDC: GitHub mints a short-lived token that assumes the AWS deploy role.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build deploy artifacts (OpenNext bundles + Storybook)
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_UI_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_UI_HOST }}
          NEXT_PUBLIC_POSTHOG_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_POSTHOG_ENVIRONMENT }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_APP_HOST: ${{ vars.POSTHOG_APP_HOST }}
          POSTHOG_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_POSTHOG_ENVIRONMENT }}
        run: pnpm build:open-next

      # CERT_RECOVERY_MODE=true: Portfolio-Cert is stuck in
      # UPDATE_COMPLETE_CLEANUP_IN_PROGRESS while Web/Admin/Storybook
      # CloudFront distributions still reference the superseded ACM cert.
      # Skip Cert entirely and redeploy only the consumer stacks with
      # --exclusively so CDK does not try to update Cert as a dependency.
      # Set CERT_RECOVERY_MODE=false and redeploy once Cert reaches
      # UPDATE_COMPLETE.
      - name: CDK deploy (edge — Dns only, cert recovery)
        if: vars.DOMAIN_ENABLED == 'true' && vars.CERT_RECOVERY_MODE == 'true'
        working-directory: packages/infra
        run: >
          pnpm exec cdk deploy Portfolio-Dns
          --require-approval never
          -c domainEnabled=${{ vars.DOMAIN_ENABLED }}
          -c googleDnsSiteVerification="${{ vars.GOOGLE_DNS_SITE_VERIFICATION }}"

      # Dns/Cert (us-east-1) deploy first and in isolation. A cert SAN change
      # forces CloudFormation to replace the physical ACM certificate, and its
      # cleanup phase can hang for hours if any CloudFront distribution
      # (Web/Admin/Storybook/CandidateMcp) still references the superseded
      # cert — see the "Portfolio-Cert stuck cleanup" incident. Failing fast
      # here, before spending time on the app stacks, makes that visible
      # immediately instead of surfacing as an opaque "stack cannot be
      # updated" error deep inside `--all`. Only the two context keys these
      # stacks actually read are passed.
      - name: CDK deploy (edge — Dns then Cert, us-east-1)
        if: vars.DOMAIN_ENABLED == 'true' && vars.CERT_RECOVERY_MODE != 'true'
        working-directory: packages/infra
        run: >
          pnpm exec cdk deploy Portfolio-Dns Portfolio-Cert
          --require-approval never
          -c domainEnabled=${{ vars.DOMAIN_ENABLED }}
          -c googleDnsSiteVerification="${{ vars.GOOGLE_DNS_SITE_VERIFICATION }}"

      # When CERT_RECOVERY_MODE=true, sync cross-region SSM cert exports from
      # Portfolio-Cert (us-east-1) before redeploying consumer CloudFront stacks.
      # Requires cert-recovery IAM on Portfolio-gha-deploy (see OidcStack).
      - name: Sync cross-region cert exports (cert recovery)
        if: vars.CERT_RECOVERY_MODE == 'true' && vars.DOMAIN_ENABLED == 'true'
        run: pnpm sync-cert-cross-region-exports

      # concurrency 1 (not the previous 4): reduces parallel CloudFormation
      # API calls/throttling risk across this stack set. Not a fix for the
      # Cert deadlock above (that was a stuck cert replacement, not a
      # same-run ordering race — CDK already serializes dependent stacks) but
      # cheap insurance while this app has more stacks/Lambdas than before.
      - name: CDK deploy (cert recovery — CloudFront cutover only)
        if: vars.CERT_RECOVERY_MODE == 'true'
        working-directory: packages/infra
        run: >
          pnpm exec cdk deploy Portfolio-Web Portfolio-Admin Portfolio-Storybook
          --exclusively
          --require-approval never --concurrency 1
          -c domainEnabled=${{ vars.DOMAIN_ENABLED }}
          -c adminUrls=${{ vars.ADMIN_URLS }}
          -c adminAllowedEmails=${{ vars.ADMIN_ALLOWED_EMAILS }}
          -c alertEmail=${{ vars.ALERT_EMAIL }}
          -c contactEmail=${{ vars.CONTACT_EMAIL }}
          -c contactFromEmail=${{ vars.CONTACT_FROM_EMAIL }}
          -c posthogProjectToken=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          -c posthogHost=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          -c posthogEnvironment=${{ vars.NEXT_PUBLIC_POSTHOG_ENVIRONMENT }}
          -c googleDnsSiteVerification="${{ vars.GOOGLE_DNS_SITE_VERIFICATION }}"
          -c githubRepo=${{ github.repository }}

      - name: CDK deploy
        if: vars.CERT_RECOVERY_MODE != 'true'
        working-directory: packages/infra
        run: >
          pnpm exec cdk deploy --all
          --require-approval never --concurrency 1
          -c domainEnabled=${{ vars.DOMAIN_ENABLED }}
          -c adminUrls=${{ vars.ADMIN_URLS }}
          -c adminAllowedEmails=${{ vars.ADMIN_ALLOWED_EMAILS }}
          -c alertEmail=${{ vars.ALERT_EMAIL }}
          -c contactEmail=${{ vars.CONTACT_EMAIL }}
          -c contactFromEmail=${{ vars.CONTACT_FROM_EMAIL }}
          -c posthogProjectToken=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          -c posthogHost=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          -c posthogEnvironment=${{ vars.NEXT_PUBLIC_POSTHOG_ENVIRONMENT }}
          -c googleDnsSiteVerification="${{ vars.GOOGLE_DNS_SITE_VERIFICATION }}"
          -c githubRepo=${{ github.repository }}

      - name: Smoke test image optimizer
        run: pnpm smoke-test:images

      # CandidateMcp is not deployed during cert recovery (Cert stack is busy;
      # full `--all` creates it once cleanup finishes).
      - name: Smoke test candidate-mcp
        if: vars.DOMAIN_ENABLED == 'true' && vars.CERT_RECOVERY_MODE != 'true'
        run: pnpm smoke-test:candidate-mcp
